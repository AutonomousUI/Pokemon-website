spring.application.name=battlesimulator
server.port=8080

# Optional. Leave empty to use the deterministic local AI fallback.
groq.api.key=
groq.model=${GROQ_MODEL:gpt-oss-120b}

# Local file-based H2 database.
spring.datasource.url=jdbc:h2:file:./data/battlesimulator;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
